<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你是哪种人生副本玩家？</title>
<style>
:root{
  --bg:#0f0f1a;
  --bg2:#1a1a2e;
  --card:#23233a;
  --card2:#2c2c46;
  --accent:#ff5c8a;
  --accent2:#ffb74d;
  --text:#f5f5fa;
  --muted:#9a9ab0;
  --green:#4ade80;
  --line:#34344e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
}
.page{display:none;min-height:100vh;animation:fadeIn .4s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== 通用 ===== */
.wrap{max-width:480px;margin:0 auto;padding:0 20px;}
.btn{
  display:block;width:100%;border:none;border-radius:14px;
  padding:15px;font-size:17px;font-weight:700;cursor:pointer;
  transition:transform .15s,opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#ff3d6e);color:#fff;box-shadow:0 6px 20px rgba(255,92,138,.35);}
.btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn-line{background:var(--card);color:var(--text);border:1.5px solid var(--line);}
.btn-sm{display:inline-block;width:auto;padding:10px 18px;font-size:14px;border-radius:10px;}

/* ===== 密码页 ===== */
#passwordPage .wrap{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding-top:40px;padding-bottom:40px;}
.logo-hero{text-align:center;margin-bottom:36px;}
.logo-hero .emoji{font-size:64px;display:block;margin-bottom:12px;}
.logo-hero h1{font-size:26px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.logo-hero p{color:var(--muted);font-size:14px;}
.pw-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;}
.pw-card label{font-size:14px;color:var(--muted);display:block;margin-bottom:10px;}
.pw-input{
  width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;
  padding:14px;font-size:18px;color:var(--text);text-align:center;letter-spacing:2px;
  margin-bottom:16px;outline:none;transition:border .2s;
}
.pw-input:focus{border-color:var(--accent);}
.pw-err{color:var(--accent);font-size:13px;text-align:center;margin-bottom:12px;min-height:18px;}
.pw-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;}

/* ===== 答题页 ===== */
#quizPage .wrap{padding-top:24px;padding-bottom:60px;}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.quiz-progress-text{font-size:13px;color:var(--muted);}
.quiz-progress-bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-bottom:24px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s;}
.quiz-q-num{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:8px;}
.quiz-question{font-size:20px;font-weight:700;margin-bottom:24px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:12px;}
.option{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:16px;font-size:15px;text-align:left;color:var(--text);cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:12px;
}
.option:active{transform:scale(.98);}
.option .opt-mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);}
.option.selected{border-color:var(--accent);background:rgba(255,92,138,.08);}
.option.selected .opt-mark{background:var(--accent);border-color:var(--accent);color:#fff;}
.quiz-nav{display:flex;gap:12px;margin-top:28px;}
.quiz-nav .btn{flex:1;}
.btn-back{background:var(--card);color:var(--muted);border:1.5px solid var(--line);}

/* ===== 结果页 ===== */
#resultPage .wrap{padding-top:24px;padding-bottom:60px;}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 22px;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;}
.result-card::before{content:"";position:absolute;top:-60px;right:-60px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,92,138,.25),transparent 70%);border-radius:50%;}
.result-emoji{font-size:64px;display:block;margin-bottom:12px;}
.result-title{font-size:26px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.result-subtitle{font-size:14px;color:var(--accent2);font-weight:600;margin-bottom:16px;}
.result-desc{font-size:15px;color:var(--text);margin-bottom:24px;text-align:left;background:var(--bg2);border-radius:14px;padding:16px;}

.radar-box{background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:16px;}
.radar-box h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px;text-align:left;}
.radar-chart{width:100%;height:200px;}

.dim-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;text-align:left;}
.dim-item{background:var(--bg2);border-radius:12px;padding:12px 14px;}
.dim-item .dim-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.dim-item .dim-name{color:var(--text);font-weight:600;}
.dim-item .dim-val{color:var(--accent2);font-weight:700;}
.dim-bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;}
.dim-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;}

.insight-box{background:var(--bg2);border-radius:14px;padding:16px;margin-bottom:16px;text-align:left;border-left:3px solid var(--accent);}
.insight-box h4{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px;}
.insight-box p{font-size:14px;color:var(--text);}

.quote-box{background:linear-gradient(135deg,rgba(255,92,138,.15),rgba(255,183,77,.15));border-radius:16px;padding:20px;margin-bottom:16px;position:relative;}
.quote-box .quote-mark{font-size:36px;color:var(--accent);opacity:.5;line-height:1;}
.quote-box p{font-size:17px;font-weight:700;color:var(--text);font-style:italic;margin-top:4px;}

.result-actions{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
.row2{display:flex;gap:12px;}
.row2 .btn{flex:1;}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-mask.show{display:flex;animation:fadeIn .25s;}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;max-width:360px;width:100%;text-align:center;}
.modal .m-emoji{font-size:48px;display:block;margin-bottom:12px;}
.modal h3{font-size:19px;font-weight:800;margin-bottom:12px;}
.modal p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.7;}
.modal .btn{margin-top:8px;}

/* toast */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:80%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:360px){
  .logo-hero h1{font-size:22px;}
  .quiz-question{font-size:18px;}
  .result-title{font-size:22px;}
}
</style>
</head>
<body>

<!-- ========== 密码页 ========== -->
<div id="passwordPage" class="page active">
  <div class="wrap">
    <div class="logo-hero">
      <span class="emoji">🎮</span>
      <h1>你是哪种人生副本玩家？</h1>
      <p>测测你的「生存策略」——好笑、扎心、又被说中</p>
    </div>
    <div class="pw-card">
      <label>输入测评密码</label>
      <input type="password" id="pwInput" class="pw-input" placeholder="请输入密码" maxlength="20" inputmode="text" autocomplete="off">
      <div class="pw-err" id="pwErr"></div>
      <button class="btn btn-primary" id="pwSubmit">开始测评</button>
      <div class="pw-hint">每个密码可测评 3 次 · 密码请向购买渠道获取</div>
    </div>
  </div>
</div>

<!-- ========== 答题页 ========== -->
<div id="quizPage" class="page">
  <div class="wrap">
    <div class="quiz-top">
      <span class="quiz-progress-text" id="quizProgressText">1 / 24</span>
      <span class="quiz-progress-text" id="quizRemainText">剩余 2 次</span>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
    <div class="quiz-q-num" id="quizQNum">第 1 题</div>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="options" id="quizOptions"></div>
    <div class="quiz-nav">
      <button class="btn btn-back" id="btnPrev" style="display:none;">上一题</button>
      <button class="btn btn-primary" id="btnNext">下一题</button>
    </div>
  </div>
</div>

<!-- ========== 结果页 ========== -->
<div id="resultPage" class="page">
  <div class="wrap">
    <div id="resultContent"></div>
  </div>
</div>

<!-- ========== 好评弹窗 ========== -->
<div class="modal-mask" id="reviewModal">
  <div class="modal">
    <span class="m-emoji">💝</span>
    <h3>感谢你的喜欢！</h3>
    <p>店铺好评后请联系客服<br>并发送好评截图<br>即可获得 <b style="color:var(--accent2)">1 元返现</b></p>
    <button class="btn btn-primary" id="reviewClose">知道了</button>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

/* ================= 密码逻辑（云端校验） ================= */
function initPassword(){
  $("pwSubmit").addEventListener("click", doLogin);
  $("pwInput").addEventListener("keydown", e=>{if(e.key==="Enter")doLogin();});
}
async function doLogin(){
  const pw = $("pwInput").value.trim().toUpperCase();
  if(!pw){
    $("pwErr").textContent = "请输入密码";
    return;
  }
  $("pwErr").textContent = "";
  $("pwSubmit").disabled = true;
  $("pwSubmit").textContent = "验证中...";

  try{
    // 调用云端 RPC 函数校验密码并消耗一次次数
    const { data, error } = await supabase.rpc("verify_password", { p_code: pw });

    if(error){
      console.error("verify_password error:", error);
      $("pwErr").textContent = "网络异常，请稍后重试";
      return;
    }

    if(!data || data.ok === false){
      if(data && data.error === "used_up"){
        $("pwErr").textContent = "该密码已用完 3 次测评次数";
      }else{
        $("pwErr").textContent = "密码错误，请核对后重试";
      }
      return;
    }

    state.pw = pw;
    const remain = data.remain;
    $("quizRemainText").textContent = "剩余 " + remain + " 次";
    startQuiz();
  }catch(e){
    console.error(e);
    $("pwErr").textContent = "网络异常，请稍后重试";
  }finally{
    $("pwSubmit").disabled = false;
    $("pwSubmit").textContent = "开始测评";
  }
}

  if(state.current < QUESTIONS.length - 1){

  }else{

function prevQuestion(){

}

/* ================= 计算维度 ================= */
function calcDimensions(){
  let A=0, B=0, D=0, Csolo=0, Csocial=0, Cout=0;
  QUESTIONS.forEach((q, i)=>{
    const ans = state.answers[i];
    if(ans === undefined) return;
    const v = q.opts[ans].v;
    if(q.d === "A") A += v;
    else if(q.d === "B") B += v;
    else if(q.d === "D") D += v;
    else if(q.d === "C"){
      if(v === "solo") Csolo++;
      else if(v === "social") Csocial++;
      else if(v === "out") Cout++;
    }
  });
  // 回血方式：社交 vs 独处（产出归入独处阵营的独立判定）
  const recovery = Csocial > Csolo ? "social" : "solo";
  const outRatio = Cout / 6; // 产出回血程度
  return {A, B, D, Csolo, Csocial, Cout, recovery, outRatio};
}

  const A = d.A >= 4 ? "H" : "L";   // 满分12，中位6，用4做阈值更贴合
  const B = d.B >= 4 ? "H" : "L";
  const D = d.D >= 4 ? "H" : "L";
  const C = d.recovery;
  // 组合映射
  const key = A + B + C + D;
  const map = {
    "HHsocialL":"mainline", "HHL":"mainline",
    "LHsocioL":"collector", "LHsociaL":"collector",
  };
  // 简化：用规则匹配
  if(A==="H" && B==="H" && D==="L") return "mainline";
  if(A==="H" && B==="H" && D==="H") return "whale";
  if(A==="L" && B==="H" && D==="H" && C==="social") return "cheater";
  if(A==="L" && B==="H" && C==="social") return "collector";
  if(A==="H" && B==="L" && D==="H" && C==="social") return "dual";
  if(A==="H" && B==="L" && D==="H") return "wolf";
  if(A==="L" && B==="L" && D==="L") return "camper";
  if(A==="L" && B==="L") return "zen";
  // 兜底：按主维度
  if(A==="H") return D==="H" ? "wolf" : "mainline";
  if(B==="H") return D==="H" ? "cheater" : "collector";
  return D==="H" ? "dual" : "zen";
}

function dimItem(name, val){
  const pct = Math.round(val);
  return `<div class="dim-item">

function drawRadar(scores){
  const canvas = $("radarCanvas");
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300;
  const h = canvas.clientHeight || 200;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const labels = Object.keys(scores);
  const values = labels.map(l=>scores[l]);
  const n = labels.length;
  const cx = w/2, cy = h/2;
  const R = Math.min(w,h)/2 - 30;

  ctx.clearRect(0,0,w,h);

  // 网格
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      const r = R*ring/4;
      const x = cx + Math.cos(ang)*r;
      const y = cy + Math.sin(ang)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.stroke();
  }
  // 轴线
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(ang)*R, cy+Math.sin(ang)*R);
    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.stroke();
  }
  // 数据区
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = R*values[i]/100;
    const x = cx + Math.cos(ang)*r;
    const y = cy + Math.sin(ang)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  const grad = ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"rgba(255,92,138,.5)");
  grad.addColorStop(1,"rgba(255,183,77,.5)");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = "#ff5c8a";
  ctx.lineWidth = 2;
  ctx.stroke();
  // 顶点
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = R*values[i]/100;
    ctx.beginPath();
    ctx.arc(cx+Math.cos(ang)*r, cy+Math.sin(ang)*r, 3, 0, 2*Math.PI);
    ctx.fillStyle = "#fff";
    ctx.fill();
  }
  // 标签
  ctx.fillStyle = "#9a9ab0";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "center";
  for(let i=0;i<n;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const x = cx + Math.cos(ang)*(R+22);
    const y = cy + Math.sin(ang)*(R+22);
    ctx.fillText(labels[i], x, y+4);
  }
}

/* ================= 保存 / 长图 / 复制 ================= */
async function saveResult(){
  if(!lastResult) return;
  // 保存到云端，获取分享 ID
  try{
    const { data: resultId, error } = await supabase.rpc("save_result", {
      p_result_type: lastResult.type,
      p_result_name: lastResult.R.name,
      p_answer_data: JSON.stringify(state.answers)
    });
    if(error){
      console.error("save_result error:", error);
    }else if(resultId){
      lastResult.shareId = resultId;
      // 生成分享链接
      lastResult.shareLink = location.href.split("?")[0] + "?id=" + resultId;
    }
  }catch(e){
    console.error(e);
  }

  toast("正在生成长图...");
  const card = $("resultCard");
  html2canvas(card, {backgroundColor:"#23233a", scale:2, useCORS:true}).then(canvas=>{
    const link = document.createElement("a");
    link.download = "人生副本玩家_"+lastResult.R.name+".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    toast("长图已保存到相册/下载目录");
  }).catch(err=>{
    console.error(err);
    toast("生成长图失败，可尝试手动截图");
  });
}

function copyLink(){
  if(!lastResult) return;
  // 优先用云端分享链接，若未保存则先保存
  if(lastResult.shareLink){
    doCopy(lastResult.shareLink);
  }else{
    // 尚未保存，先保存再复制
    toast("正在生成分享链接...");
    supabase.rpc("save_result", {
      p_result_type: lastResult.type,
      p_result_name: lastResult.R.name,
      p_answer_data: JSON.stringify(state.answers)
    }).then(({data: resultId, error})=>{
      if(error){
        console.error(error);
        toast("生成链接失败，请重试");
        return;
      }
      lastResult.shareId = resultId;
      lastResult.shareLink = location.href.split("?")[0] + "?id=" + resultId;
      doCopy(lastResult.shareLink);
    });
  }
}
function doCopy(text){
  copyToClipboard(text).then(()=>{
    toast("结果链接已复制，快去分享吧");
  });
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  return fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function retest(){
  // 再测一次：直接重新开始答题（不重新扣密码，因为密码剩余次数已扣）
  startQuiz();
}

/* ================= 分享链接结果恢复 ================= */
async function checkShareResult(){
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if(id){
    // 从云端读取分享结果
    try{
      const { data, error } = await supabase
        .from("results")
        .select("result_type")
        .eq("id", id)
        .single();
      if(error || !data){
        console.error("load share result error:", error);
        showShareNotFound();
        return true;
      }
      const type = data.result_type;
      if(RESULTS[type]){
        showShareResult(type);
        return true;
      }else{
        showShareNotFound();
        return true;
      }
    }catch(e){
      console.error(e);
      showShareNotFound();
      return true;
    }
  }
  return false;
}
function showShareNotFound(){
  const html = `
    <div class="result-card">
      <span class="result-emoji">🔍</span>
      <div class="result-title">结果未找到</div>
      <div class="result-desc">这个链接可能已失效，或结果不存在。</div>
    </div>
    <div class="result-actions">
      <button class="btn btn-primary" id="btnGoTest">我也来测一测</button>
    </div>
  `;
  $("resultContent").innerHTML = html;
  showPage("resultPage");
  $("btnGoTest").addEventListener("click", ()=>{
    location.href = location.href.split("?")[0];
  });
}
function showShareResult(type){
  const R = RESULTS[type];
  const html = `
    <div class="result-card" id="resultCard">
      <span class="result-emoji">${R.emoji}</span>
      <div class="result-title">${R.name}</div>
      <div class="result-subtitle">${R.sub}</div>
      <div class="result-desc">${R.desc}</div>
      <div class="insight-box"><h4>🔍 扎心解读</h4><p>${R.insight}</p></div>
      <div class="insight-box"><h4>📚 理论依据</h4><p>${R.theory}</p></div>
      <div class="quote-box"><span class="quote-mark">“</span><p>${R.quote}</p></div>
      <div class="insight-box"><h4>💡 进阶建议</h4><p>${R.tip}</p></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-primary" id="btnShareSave">💾 保存结果长图</button>
      <button class="btn btn-line" id="btnGoTest">我也想测一测</button>
    </div>
  `;
  $("resultContent").innerHTML = html;
  showPage("resultPage");
  $("btnShareSave").addEventListener("click", saveResult);
  $("btnGoTest").addEventListener("click", ()=>{
    location.href = location.href.split("?")[0];
  });
}

/* ================= 初始化 ================= */
async function init(){
  initPassword();
  // 好评弹窗关闭
  $("reviewClose").addEventListener("click", ()=>{$("reviewModal").classList.remove("show");});
  $("reviewModal").addEventListener("click", e=>{if(e.target===$("reviewModal"))$("reviewModal").classList.remove("show");});
  // 答题按钮
  $("btnNext").addEventListener("click", nextQuestion);
  $("btnPrev").addEventListener("click", prevQuestion);
  // 检查分享链接（异步）
  const isShare = await checkShareResult();
  if(!isShare){
    showPage("passwordPage");
  }
}
document.addEventListener("DOMContentLoaded", init);
